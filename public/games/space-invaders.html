<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Invaders Retro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020617;
      color: #38bdf8;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .hud {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: bold;
      color: #94a3b8;
    }
    .hud span { color: #38bdf8; }
    .screen {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/5;
      border: 2px solid #1e293b;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }
    .btn {
      background: #38bdf8;
      color: #020617;
      border: none;
      padding: 10px 24px;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn:hover { background: #7dd3fc; }
    .hint { margin-top: 10px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
    <div>Wave: <span id="wave">1</span></div>
  </div>

  <div class="screen">
    <canvas id="canvas" width="480" height="600"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-msg" style="color: #ef4444; font-size: 26px;">DEFENSE COMPROMISED</h2>
      <button class="btn" id="start-btn">REDEPLOY</button>
    </div>
  </div>

  <div class="hint">Left/Right Arrow or A/D to move · Space to Fire Lasers</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const waveEl = document.getElementById('wave');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    let player = { x: 220, y: 550, w: 32, h: 18, speed: 5 };
    let bullets = [];
    let alienBullets = [];
    let aliens = [];
    let alienDir = 1;
    let alienStepDown = false;
    let alienMoveTimer = 0;
    let alienMoveInterval = 40;
    let score = 0;
    let lives = 3;
    let wave = 1;
    let isGameOver = false;
    let keys = {};

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sfx(freq, dur = 0.06, type = 'square') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function createAliens() {
      aliens = [];
      const rows = 4;
      const cols = 8;
      const colors = ['#f43f5e', '#fb923c', '#eab308', '#22c55e'];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          aliens.push({
            x: 50 + c * 48,
            y: 70 + r * 38,
            w: 28,
            h: 22,
            color: colors[r],
            points: (rows - r) * 10
          });
        }
      }
      alienDir = 1;
      alienMoveInterval = Math.max(12, 40 - (wave - 1) * 5);
    }

    function reset() {
      score = 0;
      lives = 3;
      wave = 1;
      isGameOver = false;
      scoreEl.textContent = '0';
      livesEl.textContent = '3';
      waveEl.textContent = '1';
      bullets = [];
      alienBullets = [];
      overlay.classList.remove('active');
      createAliens();
    }

    function fire() {
      if (bullets.length < 2 && !isGameOver) {
        bullets.push({ x: player.x + player.w / 2 - 2, y: player.y - 6, w: 4, h: 10 });
        sfx(880, 0.05);
      }
    }

    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') {
        e.preventDefault();
        fire();
      }
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function update() {
      if (isGameOver) return;

      // Player move
      if (keys['ArrowLeft'] || keys['KeyA']) {
        player.x = Math.max(10, player.x - player.speed);
      }
      if (keys['ArrowRight'] || keys['KeyD']) {
        player.x = Math.min(canvas.width - player.w - 10, player.x + player.speed);
      }

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= 8;
        if (b.y < 0) {
          bullets.splice(i, 1);
          continue;
        }

        // Check hit alien
        for (let j = aliens.length - 1; j >= 0; j--) {
          const a = aliens[j];
          if (b.x + b.w >= a.x && b.x <= a.x + a.w && b.y <= a.y + a.h && b.y + b.h >= a.y) {
            score += a.points;
            scoreEl.textContent = score;
            sfx(320, 0.1, 'sawtooth');
            aliens.splice(j, 1);
            bullets.splice(i, 1);
            break;
          }
        }
      }

      // Wave clear
      if (aliens.length === 0) {
        wave++;
        waveEl.textContent = wave;
        sfx(700, 0.2, 'sine');
        createAliens();
      }

      // Alien Movement
      alienMoveTimer++;
      if (alienMoveTimer >= alienMoveInterval) {
        alienMoveTimer = 0;
        let changeDir = false;

        aliens.forEach(a => {
          if ((alienDir === 1 && a.x + a.w >= canvas.width - 20) || (alienDir === -1 && a.x <= 20)) {
            changeDir = true;
          }
        });

        if (changeDir) {
          alienDir *= -1;
          aliens.forEach(a => {
            a.y += 18;
            if (a.y + a.h >= player.y) {
              isGameOver = true;
              overlayMsg.textContent = 'INVASION SUCCESSFUL';
              overlay.classList.add('active');
            }
          });
        } else {
          aliens.forEach(a => { a.x += alienDir * 12; });
        }

        // Alien random shot
        if (Math.random() < 0.35 && aliens.length > 0) {
          const shooter = aliens[Math.floor(Math.random() * aliens.length)];
          alienBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, w: 3, h: 8 });
        }
      }

      // Alien bullets
      for (let i = alienBullets.length - 1; i >= 0; i--) {
        const ab = alienBullets[i];
        ab.y += 4.5;
        if (ab.y > canvas.height) {
          alienBullets.splice(i, 1);
          continue;
        }

        // Hit player
        if (ab.x >= player.x && ab.x <= player.x + player.w && ab.y >= player.y && ab.y <= player.y + player.h) {
          alienBullets.splice(i, 1);
          lives--;
          livesEl.textContent = lives;
          sfx(120, 0.25, 'sawtooth');
          if (lives <= 0) {
            isGameOver = true;
            overlayMsg.textContent = 'GAME OVER';
            overlay.classList.add('active');
          }
        }
      }

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Starfield
      ctx.fillStyle = '#475569';
      for (let i = 0; i < 25; i++) {
        const sx = (i * 97) % canvas.width;
        const sy = (i * 63 + score) % canvas.height;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      // Player cannon
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(player.x, player.y + 6, player.w, player.h - 6);
      ctx.fillRect(player.x + player.w / 2 - 3, player.y, 6, 8);

      // Player bullets
      ctx.fillStyle = '#fde047';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Alien bullets
      ctx.fillStyle = '#f43f5e';
      alienBullets.forEach(ab => ctx.fillRect(ab.x, ab.y, ab.w, ab.h));

      // Aliens
      aliens.forEach(a => {
        ctx.fillStyle = a.color;
        ctx.fillRect(a.x + 4, a.y, a.w - 8, a.h);
        ctx.fillRect(a.x, a.y + 6, a.w, a.h - 10);
        // Eyes
        ctx.fillStyle = '#000';
        ctx.fillRect(a.x + 6, a.y + 7, 3, 4);
        ctx.fillRect(a.x + a.w - 9, a.y + 7, 3, 4);
      });
    }

    startBtn.addEventListener('click', () => { reset(); update(); });

    reset();
    update();
  </script>
</body>
</html>
