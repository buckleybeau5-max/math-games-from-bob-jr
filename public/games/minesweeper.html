<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .game-window {
      background: #1e293b;
      border: 3px solid #334155;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 95vw;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 14px;
    }
    .led-display {
      background: #000;
      color: #ef4444;
      font-family: 'Space Mono', 'Courier New', Courier, monospace;
      font-size: 24px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 2px;
      border: 1px solid #334155;
      min-width: 60px;
      text-align: center;
    }
    .face-btn {
      font-size: 26px;
      background: #334155;
      border: 2px solid #475569;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .face-btn:active { transform: scale(0.92); }
    .diff-selector {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .diff-btn {
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .diff-btn.active {
      background: #f59e0b;
      color: #0f172a;
      border-color: #f59e0b;
      font-weight: 700;
    }
    .flag-toggle {
      background: #0f172a;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .flag-toggle.active {
      background: #ef4444;
      color: #fff;
      border-color: #dc2626;
    }
    .board-grid {
      display: grid;
      gap: 2px;
      background: #334155;
      padding: 3px;
      border-radius: 6px;
      border: 2px solid #475569;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #475569;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .cell:hover:not(.revealed) { background: #64748b; }
    .cell.revealed {
      background: #1e293b;
      cursor: default;
    }
    .cell.mine { background: #ef4444; color: #fff; }
    .c-1 { color: #38bdf8; }
    .c-2 { color: #4ade80; }
    .c-3 { color: #f87171; }
    .c-4 { color: #818cf8; }
    .c-5 { color: #f59e0b; }
    .c-6 { color: #2dd4bf; }
    .c-7 { color: #e879f9; }
    .c-8 { color: #cbd5e1; }
    .hint { margin-top: 12px; font-size: 12px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="game-window">
    <div class="diff-selector">
      <button class="diff-btn active" data-diff="beginner">Beginner (9x9)</button>
      <button class="diff-btn" data-diff="intermediate">Medium (12x12)</button>
    </div>

    <button class="flag-toggle" id="flag-toggle">🚩 Mode: Reveal (Tap to Flag)</button>

    <div class="header-bar">
      <div class="led-display" id="mines-left">010</div>
      <div class="face-btn" id="face">🙂</div>
      <div class="led-display" id="timer">000</div>
    </div>

    <div class="board-grid" id="board"></div>
  </div>

  <div class="hint">Left click to reveal · Right click or Flag Mode to place flags</div>

  <script>
    const CONFIGS = {
      beginner: { rows: 9, cols: 9, mines: 10, cellSize: 32 },
      intermediate: { rows: 12, cols: 12, mines: 22, cellSize: 26 }
    };

    let curDiff = 'beginner';
    let { rows, cols, mines, cellSize } = CONFIGS.beginner;
    let grid = [];
    let state = 'READY'; // READY, PLAYING, WON, LOST
    let flagMode = false;
    let timerVal = 0;
    let timerInterval = null;
    let flagsPlaced = 0;

    const boardEl = document.getElementById('board');
    const minesLeftEl = document.getElementById('mines-left');
    const timerEl = document.getElementById('timer');
    const faceEl = document.getElementById('face');
    const flagToggleBtn = document.getElementById('flag-toggle');

    function pad(n) {
      return String(Math.max(-99, Math.min(999, n))).padStart(3, '0');
    }

    function init() {
      state = 'READY';
      clearInterval(timerInterval);
      timerVal = 0;
      timerEl.textContent = '000';
      faceEl.textContent = '🙂';
      flagsPlaced = 0;
      minesLeftEl.textContent = pad(mines);

      boardEl.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
      boardEl.innerHTML = '';
      grid = [];

      for (let r = 0; r < rows; r++) {
        grid[r] = [];
        for (let c = 0; c < cols; c++) {
          const cell = {
            r, c,
            isMine: false,
            isRevealed: false,
            isFlagged: false,
            count: 0,
            el: document.createElement('div')
          };
          cell.el.className = 'cell';
          cell.el.style.width = `${cellSize}px`;
          cell.el.style.height = `${cellSize}px`;
          cell.el.addEventListener('click', e => handleClick(r, c));
          cell.el.addEventListener('contextmenu', e => {
            e.preventDefault();
            toggleFlag(r, c);
          });
          boardEl.appendChild(cell.el);
          grid[r][c] = cell;
        }
      }
    }

    function plantMines(safeR, safeC) {
      let planted = 0;
      while (planted < mines) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        if (!grid[r][c].isMine && !(Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1)) {
          grid[r][c].isMine = true;
          planted++;
        }
      }

      // Calculate counts
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!grid[r][c].isMine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].isMine) {
                  count++;
                }
              }
            }
            grid[r][c].count = count;
          }
        }
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timerVal++;
        timerEl.textContent = pad(timerVal);
      }, 1000);
    }

    function handleClick(r, c) {
      if (state === 'WON' || state === 'LOST') return;
      if (flagMode) {
        toggleFlag(r, c);
        return;
      }

      const cell = grid[r][c];
      if (cell.isFlagged || cell.isRevealed) return;

      if (state === 'READY') {
        state = 'PLAYING';
        plantMines(r, c);
        startTimer();
      }

      reveal(r, c);
      checkWin();
    }

    function toggleFlag(r, c) {
      if (state === 'WON' || state === 'LOST') return;
      const cell = grid[r][c];
      if (cell.isRevealed) return;

      cell.isFlagged = !cell.isFlagged;
      if (cell.isFlagged) {
        cell.el.textContent = '🚩';
        flagsPlaced++;
      } else {
        cell.el.textContent = '';
        flagsPlaced--;
      }
      minesLeftEl.textContent = pad(mines - flagsPlaced);
    }

    function reveal(r, c) {
      const cell = grid[r][c];
      if (cell.isRevealed || cell.isFlagged) return;

      cell.isRevealed = true;
      cell.el.classList.add('revealed');

      if (cell.isMine) {
        // Explode
        cell.el.classList.add('mine');
        cell.el.textContent = '💣';
        gameOver(false);
        return;
      }

      if (cell.count > 0) {
        cell.el.textContent = cell.count;
        cell.el.classList.add(`c-${cell.count}`);
      } else {
        // Flood fill empty neighbors
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
              reveal(nr, nc);
            }
          }
        }
      }
    }

    function checkWin() {
      let unrevealedNonMines = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!grid[r][c].isMine && !grid[r][c].isRevealed) {
            unrevealedNonMines++;
          }
        }
      }
      if (unrevealedNonMines === 0) {
        gameOver(true);
      }
    }

    function gameOver(won) {
      clearInterval(timerInterval);
      state = won ? 'WON' : 'LOST';
      faceEl.textContent = won ? '😎' : '😵';

      // Reveal all mines
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = grid[r][c];
          if (cell.isMine) {
            if (won) {
              cell.el.textContent = '🚩';
            } else if (!cell.isRevealed) {
              cell.el.textContent = '💣';
            }
          }
        }
      }
    }

    flagToggleBtn.addEventListener('click', () => {
      flagMode = !flagMode;
      flagToggleBtn.classList.toggle('active', flagMode);
      flagToggleBtn.textContent = flagMode ? '🚩 Mode: Place Flags' : '🔍 Mode: Reveal';
    });

    faceEl.addEventListener('click', init);

    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        curDiff = btn.dataset.diff;
        rows = CONFIGS[curDiff].rows;
        cols = CONFIGS[curDiff].cols;
        mines = CONFIGS[curDiff].mines;
        cellSize = CONFIGS[curDiff].cellSize;
        init();
      });
    });

    init();
  </script>
</body>
</html>
