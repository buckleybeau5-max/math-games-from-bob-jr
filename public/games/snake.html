<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #10b981;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .hud {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: bold;
      color: #34d399;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hud span { color: #f8fafc; }
    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1;
      border: 2px solid #059669;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
      border-radius: 8px;
      overflow: hidden;
      background: #040810;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 8, 16, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .overlay h2 {
      font-size: 28px;
      color: #f43f5e;
      text-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
    }
    .btn {
      background: #10b981;
      color: #040810;
      border: none;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn:hover { background: #34d399; }
    .controls-hint {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
    }
    /* Touch d-pad for mobile */
    .dpad {
      display: none;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 6px;
      margin-top: 16px;
    }
    @media (max-width: 768px) {
      .dpad { display: grid; }
    }
    .d-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #34d399;
      border-radius: 8px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .d-btn:active { background: #10b981; color: #040810; }
  </style>
</head>
<body>
  <div class="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">GAME OVER</h2>
      <p style="color: #94a3b8; font-size: 14px;">Press Space or Tap to Restart</p>
      <button class="btn" id="start-btn">Play Again</button>
    </div>
  </div>

  <div class="controls-hint">Arrow Keys or WASD to Move · Space to Pause</div>

  <div class="dpad">
    <div></div><button class="d-btn" id="up-btn">▲</button><div></div>
    <button class="d-btn" id="left-btn">◀</button><div></div><button class="d-btn" id="right-btn">▶</button>
    <div></div><button class="d-btn" id="down-btn">▼</button><div></div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const startBtn = document.getElementById('start-btn');

    const GRID = 20;
    const COUNT = 20;
    let snake = [{ x: 10, y: 10 }];
    let food = { x: 5, y: 5 };
    let goldenFood = null;
    let goldenTimer = 0;
    let dx = 1, dy = 0;
    let nextDx = 1, nextDy = 0;
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_best') || '0', 10);
    bestEl.textContent = best;
    let gameLoop = null;
    let isGameOver = false;
    let isPaused = false;
    let speed = 110;

    // Web Audio synthesizer for bleeps
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, duration = 0.08, type = 'square') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      speed = 110;
      scoreEl.textContent = '0';
      isGameOver = false;
      isPaused = false;
      goldenFood = null;
      overlay.classList.remove('active');
      spawnFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(update, speed);
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * COUNT),
          y: Math.floor(Math.random() * COUNT)
        };
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
      if (Math.random() < 0.25 && !goldenFood && score > 30) {
        let gvalid = false;
        while (!gvalid) {
          goldenFood = {
            x: Math.floor(Math.random() * COUNT),
            y: Math.floor(Math.random() * COUNT)
          };
          gvalid = !snake.some(s => s.x === goldenFood.x && s.y === goldenFood.y) && (goldenFood.x !== food.x || goldenFood.y !== food.y);
        }
        goldenTimer = 60; // steps
      }
    }

    function update() {
      if (isPaused || isGameOver) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        triggerGameOver();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        triggerGameOver();
        return;
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        beep(540, 0.08, 'square');
        if (score > best) {
          best = score;
          localStorage.setItem('snake_best', best);
          bestEl.textContent = best;
        }
        scoreEl.textContent = score;
        spawnFood();
        // Speed up gradually
        if (speed > 55 && score % 40 === 0) {
          speed -= 4;
          clearInterval(gameLoop);
          gameLoop = setInterval(update, speed);
        }
      } else if (goldenFood && head.x === goldenFood.x && head.y === goldenFood.y) {
        score += 35;
        beep(880, 0.15, 'triangle');
        goldenFood = null;
        scoreEl.textContent = score;
      } else {
        snake.pop();
      }

      if (goldenFood) {
        goldenTimer--;
        if (goldenTimer <= 0) goldenFood = null;
      }

      draw();
    }

    function triggerGameOver() {
      isGameOver = true;
      beep(180, 0.35, 'sawtooth');
      clearInterval(gameLoop);
      overlayTitle.textContent = 'GAME OVER';
      overlay.classList.add('active');
    }

    function draw() {
      ctx.fillStyle = '#040810';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw faint grid
      ctx.strokeStyle = '#091522';
      ctx.lineWidth = 1;
      for (let i = 0; i <= COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID, 0);
        ctx.lineTo(i * GRID, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID);
        ctx.lineTo(canvas.width, i * GRID);
        ctx.stroke();
      }

      // Draw regular food
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw golden food
      if (goldenFood) {
        ctx.fillStyle = '#facc15';
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(goldenFood.x * GRID + GRID/2, goldenFood.y * GRID + GRID/2, GRID/2 - 1, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw snake
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#34d399' : '#10b981';
        ctx.shadowColor = i === 0 ? '#34d399' : '#059669';
        ctx.shadowBlur = i === 0 ? 8 : 4;
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);

        // Eyes on head
        if (i === 0) {
          ctx.fillStyle = '#040810';
          const eyeSize = 3;
          let e1x = seg.x * GRID + 5, e1y = seg.y * GRID + 5;
          let e2x = seg.x * GRID + 12, e2y = seg.y * GRID + 5;
          if (dy !== 0) {
            e1x = seg.x * GRID + 5; e2x = seg.x * GRID + 12;
            e1y = e2y = dy > 0 ? seg.y * GRID + 12 : seg.y * GRID + 5;
          } else if (dx !== 0) {
            e1x = e2x = dx > 0 ? seg.x * GRID + 12 : seg.x * GRID + 5;
            e1y = seg.y * GRID + 5; e2y = seg.y * GRID + 12;
          }
          ctx.fillRect(e1x, e1y, eyeSize, eyeSize);
          ctx.fillRect(e2x, e2y, eyeSize, eyeSize);
        }
      });

      ctx.shadowBlur = 0;
    }

    function changeDir(newDx, newDy) {
      if (isGameOver) return;
      if (newDx !== 0 && dx === -newDx) return;
      if (newDy !== 0 && dy === -newDy) return;
      nextDx = newDx;
      nextDy = newDy;
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); changeDir(0, -1); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); changeDir(0, 1); }
      else if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); changeDir(-1, 0); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); changeDir(1, 0); }
      else if (e.code === 'Space') {
        e.preventDefault();
        if (isGameOver) {
          reset();
        } else {
          isPaused = !isPaused;
          if (isPaused) {
            overlayTitle.textContent = 'PAUSED';
            overlay.classList.add('active');
          } else {
            overlay.classList.remove('active');
          }
        }
      }
    });

    document.getElementById('up-btn').addEventListener('click', () => changeDir(0, -1));
    document.getElementById('down-btn').addEventListener('click', () => changeDir(0, 1));
    document.getElementById('left-btn').addEventListener('click', () => changeDir(-1, 0));
    document.getElementById('right-btn').addEventListener('click', () => changeDir(1, 0));
    startBtn.addEventListener('click', reset);

    reset();
  </script>
</body>
</html>
