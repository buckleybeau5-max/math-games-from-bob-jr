<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title {
      font-size: 38px;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: -1px;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-box {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #334155;
      min-width: 72px;
    }
    .score-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 700;
    }
    .score-value {
      font-size: 18px;
      font-weight: 800;
      color: #f8fafc;
    }
    .controls-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #d97706; }
    .hint { font-size: 12px; color: #64748b; }
    .grid-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 400px;
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 12px;
      border: 2px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .cell {
      background: #334155;
      border-radius: 6px;
      opacity: 0.6;
    }
    .tile-container {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      pointer-events: none;
    }
    .tile {
      position: absolute;
      width: calc((100% - 36px) / 4);
      height: calc((100% - 36px) / 4);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      transition: transform 100ms ease-in-out;
      animation: pop 150ms ease;
    }
    @keyframes pop {
      0% { transform: scale(0); }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .tile-2 { background: #e2e8f0; color: #1e293b; }
    .tile-4 { background: #cbd5e1; color: #1e293b; }
    .tile-8 { background: #fed7aa; color: #9a3412; }
    .tile-16 { background: #fdba74; color: #7c2d12; }
    .tile-32 { background: #fb923c; color: #fff; }
    .tile-64 { background: #f97316; color: #fff; }
    .tile-128 { background: #fde047; color: #713f12; font-size: 22px; }
    .tile-256 { background: #facc15; color: #713f12; font-size: 22px; }
    .tile-512 { background: #eab308; color: #fff; font-size: 22px; }
    .tile-1024 { background: #10b981; color: #fff; font-size: 18px; }
    .tile-2048 { background: #06b6d4; color: #fff; font-size: 18px; box-shadow: 0 0 15px rgba(6,182,212,0.6); }
    .tile-super { background: #8b5cf6; color: #fff; font-size: 16px; }

    .game-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms;
    }
    .game-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .overlay-msg {
      font-size: 28px;
      font-weight: 800;
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div id="score" class="score-value">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div id="best-score" class="score-value">0</div>
      </div>
    </div>
  </div>

  <div class="controls-bar">
    <button id="restart-btn" class="btn">New Game</button>
    <div class="hint">Use Arrow keys or Swipe</div>
  </div>

  <div class="grid-container" id="grid">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="tile-container" id="tile-container"></div>
    <div class="game-overlay" id="overlay">
      <div class="overlay-msg" id="overlay-msg">Game Over!</div>
      <button class="btn" id="overlay-restart">Try Again</button>
    </div>
  </div>

  <script>
    const SIZE = 4;
    let grid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('2048_best') || '0', 10);
    document.getElementById('best-score').textContent = bestScore;

    const tileContainer = document.getElementById('tile-container');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');

    function init() {
      grid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
      score = 0;
      updateScore(0);
      overlay.classList.remove('active');
      addRandomTile();
      addRandomTile();
      render();
    }

    function addRandomTile() {
      const emptyCells = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 0) emptyCells.push({ r, c });
        }
      }
      if (emptyCells.length === 0) return;
      const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function updateScore(delta) {
      score += delta;
      document.getElementById('score').textContent = score;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('2048_best', bestScore);
        document.getElementById('best-score').textContent = bestScore;
      }
    }

    function render() {
      tileContainer.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const val = grid[r][c];
          if (val > 0) {
            const tile = document.createElement('div');
            const cls = val <= 2048 ? `tile-${val}` : 'tile-super';
            tile.className = `tile ${cls}`;
            tile.textContent = val;
            const topPercent = (r * 25) + (r * 1.5);
            const leftPercent = (c * 25) + (c * 1.5);
            tile.style.top = `calc(${r} * (100% - 36px) / 4 + ${r * 12}px)`;
            tile.style.left = `calc(${c} * (100% - 36px) / 4 + ${c * 12}px)`;
            tileContainer.appendChild(tile);
          }
        }
      }
    }

    function slideRow(row) {
      let arr = row.filter(val => val !== 0);
      let gained = 0;
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          gained += arr[i];
          arr.splice(i + 1, 1);
        }
      }
      while (arr.length < SIZE) {
        arr.push(0);
      }
      return { newRow: arr, gained };
    }

    function moveLeft() {
      let moved = false;
      let totalGained = 0;
      for (let r = 0; r < SIZE; r++) {
        const { newRow, gained } = slideRow(grid[r]);
        totalGained += gained;
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] !== newRow[c]) moved = true;
          grid[r][c] = newRow[c];
        }
      }
      if (totalGained > 0) updateScore(totalGained);
      return moved;
    }

    function rotateClockwise() {
      const newGrid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          newGrid[c][SIZE - 1 - r] = grid[r][c];
        }
      }
      grid = newGrid;
    }

    function move(dir) {
      let moved = false;
      if (dir === 'left') {
        moved = moveLeft();
      } else if (dir === 'up') {
        rotateClockwise(); rotateClockwise(); rotateClockwise();
        moved = moveLeft();
        rotateClockwise();
      } else if (dir === 'right') {
        rotateClockwise(); rotateClockwise();
        moved = moveLeft();
        rotateClockwise(); rotateClockwise();
      } else if (dir === 'down') {
        rotateClockwise();
        moved = moveLeft();
        rotateClockwise(); rotateClockwise(); rotateClockwise();
      }

      if (moved) {
        addRandomTile();
        render();
        if (isGameOver()) {
          overlayMsg.textContent = 'Game Over!';
          overlay.classList.add('active');
        }
      }
    }

    function isGameOver() {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 0) return false;
          if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return false;
          if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return false;
        }
      }
      return true;
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); move('up'); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); move('down'); }
      else if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); move('left'); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); move('right'); }
    });

    let touchStartX = 0, touchStartY = 0;
    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        if (dx > 0) move('right'); else move('left');
      } else if (Math.abs(dy) > 30) {
        if (dy > 0) move('down'); else move('up');
      }
    }, { passive: true });

    document.getElementById('restart-btn').addEventListener('click', init);
    document.getElementById('overlay-restart').addEventListener('click', init);

    init();
  </script>
</body>
</html>
